# .github/workflows/backtest.yml
name: Bank Nifty Option Backtest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Run every Monday at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  backtest:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pandas numpy yfinance matplotlib seaborn openpyxl
    
    - name: Run backtest
      run: |
        python backtest.py
    
    - name: Upload reports
      uses: actions/upload-artifact@v3
      with:
        name: backtest-reports
        path: reports/
        retention-days: 30
    
    - name: Upload logs
      uses: actions/upload-artifact@v3
      with:
        name: backtest-logs
        path: backtest.log
        retention-days: 7